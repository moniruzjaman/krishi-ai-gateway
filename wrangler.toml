name = "krishi-ai-gateway"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "api.krishiai.live/*"
zone_name = "krishiai.live"

[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://vlfyhgyowfhhujgywxud.supabase.co"
# Claude/Grok have no free API tier: keep paid providers off unless explicitly enabled.
ALLOW_PAID_PROVIDERS = "false"
# Secrets (set with `npx wrangler secret put <NAME>`):
#   GEMINI_API_KEY, GROQ_API_KEY, OPENROUTER_API_KEY, HF_TOKEN, SUPABASE_ANON_KEY, KRISHI_API_TOKEN
#   optional (paid): ANTHROPIC_API_KEY, XAI_API_KEY

[[kv_namespaces]]
binding = "KRISHI_KV"
id = "366ebccefc354a67b95ad90b53aa0f5e"

[observability.logs]
enabled = true
invocation_logs = true
